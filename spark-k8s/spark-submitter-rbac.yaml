# Used only on homeserver to run spark-submit against the API (lab use).
apiVersion: v1
kind: ServiceAccount
metadata:
  name: spark-submitter
  namespace: default
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: spark-submitter-cluster-admin
subjects:
  - kind: ServiceAccount
    name: spark-submitter
    namespace: default
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: cluster-admin
