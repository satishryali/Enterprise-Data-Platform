version: 2

sources:
  - name: raw
    schema: raw
    tables:
      - name: employees
        description: CSV landings loaded by Airflow
        columns:
          - name: employee_id
          - name: first_name
          - name: last_name
          - name: email
          - name: phone
          - name: department
          - name: salary
          - name: joining_date
          - name: _loaded_at
          - name: _source_file
      - name: orders
        description: CSV landings loaded by the orders mini-pipeline
        columns:
          - name: order_id
          - name: customer_name
          - name: email
          - name: product
          - name: quantity
          - name: price
          - name: order_date
          - name: _loaded_at
          - name: _source_file
