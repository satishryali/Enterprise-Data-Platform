# DEV-only. Never attached to the PROD compose project.
services:
  oracle-free:
    image: gvenzl/oracle-free:latest
    container_name: edp-dev-oracle
    restart: unless-stopped
    profiles: ["oracle"]
    ports:
      - "1521:1521"
    environment:
      ORACLE_PASSWORD: ${ORACLE_PASSWORD:-Password123}
      ORACLE_DATABASE: FREEPDB1
    volumes:
      - /mnt/storage/import/oracle/oradata:/opt/oracle/oradata
      - /mnt/storage/import/oracle_backup:/opt/oracle/backup:ro
    shm_size: 1g
    mem_limit: 2560m
    cpus: 2.0
    healthcheck:
      test: ["CMD", "healthcheck.sh"]
      interval: 30s
      timeout: 10s
      retries: 40
      start_period: 120s
